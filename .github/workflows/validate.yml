name: Validate pack submissions

on:
  pull_request:
    paths:
      - "submissions/**"
      - "scripts/validate_pack.py"
      - "templates/**"
  push:
    paths:
      - "submissions/**"
      - "scripts/validate_pack.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate submissions
        run: python3 scripts/validate_pack.py
